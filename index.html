                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ==============================================================
                STAGE 4: DUAL-PANE REVIEW CANVAS (THE STAR FEATURE ⭐)
            ============================================================== */}
            {currentStage === 4 && (
              <div className="space-y-4">
                <div className="flex justify-between items-start">
                  <div>
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <span className="text-blue-500">Stage 04:</span> Dual-Pane Human Review Canvas
                    </h2>
                    <p className="text-sm text-slate-400">
                      Human-in-the-loop control: The outgoing developer inspects raw source proof on the left, edits or annotates cards on the right, and locks the handover.
                    </p>
                  </div>
                  <button
                    onClick={handleSealHandover}
                    className="px-5 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow-lg shadow-emerald-600/20 transition flex items-center space-x-2"
                  >
                    <span>🔒 Approve & Seal Handover Package</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[580px]">
                  
                  {/* Left Pane: Raw Evidence Inspector (5 cols) */}
                  <div className="lg:col-span-5 bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col">
                    <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                        <span>🔍 Evidence Inspector</span>
                      </span>
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">
                        {activeSource?.id}
                      </span>
                    </div>

                    <div className="mb-3">
                      <div className="text-xs font-semibold text-blue-400">{activeSource?.title}</div>
                      <div className="text-[11px] text-slate-400">{activeSource?.author} • {new Date(activeSource?.timestamp).toLocaleDateString()}</div>
                    </div>

                    <div className="flex-1 bg-slate-950 p-3 rounded-lg border border-slate-900 text-xs font-mono text-slate-300 whitespace-pre-wrap leading-relaxed overflow-y-auto max-h-[400px]">
                      {activeSource?.content}
                    </div>

                    <div className="mt-3 p-2.5 rounded bg-blue-950/40 border border-blue-800/40 text-[11px] text-blue-200">
                      💡 <b>Citation Anchor:</b> The active claim on the right is derived directly from this source text block.
                    </div>
                  </div>

                  {/* Right Pane: Editable Handover Cards (7 cols) */}
                  <div className="lg:col-span-7 bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col space-y-3.5 overflow-y-auto max-h-[620px]">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-300">
                        Handover Cards (Click to Inspect Source)
                      </span>
                      <span className="text-xs text-slate-400">{claims.filter(c => c.is_approved).length} of {claims.length} Approved</span>
                    </div>

                    {claims.map(claim => {
                      const isSelected = claim.id === selectedClaimId;
                      return (
                        <div
                          key={claim.id}
                          onClick={() => setSelectedClaimId(claim.id)}
                          className={`p-4 rounded-xl border transition cursor-pointer ${
                            isSelected ? 'bg-slate-850 border-blue-500 shadow-md shadow-blue-500/10' : 'bg-slate-950/60 border-slate-800/80 hover:border-slate-700'
                          }`}
                        >
                          <div className="flex justify-between items-start gap-2 mb-2">
                            <div className="flex items-center space-x-2">
                              <input
                                type="checkbox"
                                checked={claim.is_approved}
                                onChange={(e) => {
                                  e.stopPropagation();
                                  handleClaimUpdate(claim.id, 'is_approved', e.target.checked);
                                }}
                                className="w-4 h-4 rounded text-blue-600 bg-slate-900 border-slate-700"
                              />
                              <span className="font-semibold text-sm text-slate-100">{claim.title}</span>
                            </div>

                            <span className={`text-[10px] font-mono px-2 py-0.5 rounded uppercase font-bold shrink-0 ${
                              claim.verification_status === 'verified' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' :
                              claim.verification_status === 'contradiction' ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                              'bg-amber-950 text-amber-300 border border-amber-800'
                            }`}>
                              {claim.verification_status}
                            </span>
                          </div>

                          <p className="text-xs text-slate-300 leading-relaxed pl-6">{claim.summary}</p>

                          {claim.conflict_notes && (
                            <div className="ml-6 mt-2 p-2 rounded bg-amber-950/40 border border-amber-800/40 text-[11px] text-amber-300">
                              ⚠️ {claim.conflict_notes}
                            </div>
                          )}

                          {/* Human Notes / Tips */}
                          <div className="ml-6 mt-2.5">
                            <label className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-1">
                              Departing Contributor's Private Tip:
                            </label>
                            <input
                              type="text"
                              value={claim.human_notes || ""}
                              onChange={(e) => handleClaimUpdate(claim.id, 'human_notes', e.target.value)}
                              placeholder="Add human tip or clarification for successor..."
                              className="w-full text-xs px-2.5 py-1.5 rounded bg-slate-900 border border-slate-800 text-slate-200 focus:outline-none focus:border-blue-500"
                            />
                          </div>

                          <div className="ml-6 mt-2.5 flex items-center justify-between text-[11px] text-slate-400">
                            <span className="font-mono text-blue-400">Citation: [{claim.citation_source_id}]</span>
                            <span className="text-[10px] text-slate-500">Click card to highlight evidence &rarr;</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* ==============================================================
                STAGE 5: ROLE-TAILORED HANDOVER OUTPUT
            ============================================================== */}
            {currentStage === 5 && (
              <div className="space-y-6">
                <div className="flex flex-wrap justify-between items-start gap-4">
                  <div>
                    <div className="flex items-center space-x-2 mb-1">
                      <span className="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-bold uppercase">
                        ✓ Handover Sealed & Verified
                      </span>
                      <span className="text-xs text-slate-400">Timestamp: {new Date().toLocaleDateString()}</span>
                    </div>
                    <h2 className="text-xl font-bold text-white">
                      FestFlow: Campus Fest Web Portal — Continuation Package
                    </h2>
                    <p className="text-sm text-slate-400">
                      Tailored transition briefing generated for incoming recruit <b>Anshika Aggarwal</b>.
                    </p>
                  </div>

                  {/* Role Switcher */}
                  <div className="flex items-center space-x-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
                    <button
                      onClick={() => setSelectedRole("developer")}
                      className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${
                        selectedRole === 'developer' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      💻 Junior Developer View
                    </button>
                    <button
                      onClick={() => setSelectedRole("lead")}
                      className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${
                        selectedRole === 'lead' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      👔 Project Lead View
                    </button>
                  </div>
                </div>

                {/* Day-1 Checklist Section */}
                <div className="p-5 rounded-xl bg-slate-900/80 border border-slate-800">
                  <h3 className="text-sm font-bold text-slate-200 uppercase tracking-wider mb-3 flex items-center justify-between">
                    <span>🚀 Day-1 Action Checklist ({selectedRole === 'developer' ? 'Developer Onboarding' : 'Lead Handover'})</span>
                    <span className="text-xs text-blue-400 font-normal">Interactive Tasks</span>
                  </h3>
                  <div className="space-y-2.5">
                    {selectedRole === 'developer' ? [
                      { id: 'task1', text: "Clone repo and verify local zero-config SQLite database initialization (no Docker needed)." },
                      { id: 'task2', text: "Inspect Safari iOS auth cookie gotcha documented in CLM-02 before touching auth middleware." },
                      { id: 'task3', text: "Verify client-side SVG QR code generator in PR #14 (prevents RAM spikes)." },
                      { id: 'task4', text: "Check scripts/backup_db.py for TASK-55 and follow up with IT department for S3 credentials." }
                    ].map(item => (
                      <label key={item.id} className="flex items-center space-x-3 p-2.5 rounded-lg bg-slate-950/60 border border-slate-800/60 cursor-pointer hover:bg-slate-950">
                        <input
                          type="checkbox"
                          checked={checklistState[item.id]}
                          onChange={() => toggleChecklist(item.id)}
                          className="w-4 h-4 rounded text-blue-600 bg-slate-900 border-slate-700"
                        />
                        <span className={`text-xs ${checklistState[item.id] ? 'line-through text-slate-500' : 'text-slate-300'}`}>
                          {item.text}
                        </span>
                      </label>
                    )) : [
                      { id: 'task1', text: "Contact College Tech Club President to transition GitHub Organization Secrets admin permissions." },
                      { id: 'task2', text: "Review active risk matrix regarding pending AWS S3 backup approval from faculty coordinator." },
                      { id: 'task3', text: "Confirm incoming 1st-year recruit (Anshika Aggarwal) has write access to repository." }
                    ].map(item => (
                      <label key={item.id} className="flex items-center space-x-3 p-2.5 rounded-lg bg-slate-950/60 border border-slate-800/60 cursor-pointer hover:bg-slate-950">
                        <input
                          type="checkbox"
                          checked={checklistState[item.id]}
                          onChange={() => toggleChecklist(item.id)}
                          className="w-4 h-4 rounded text-blue-600 bg-slate-900 border-slate-700"
                        />
                        <span className={`text-xs ${checklistState[item.id] ? 'line-through text-slate-500' : 'text-slate-300'}`}>
                          {item.text}
                        </span>
                      </label>
                    ))}
                  </div>
                </div>

                {/* Approved Handover Briefing Cards */}
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-slate-200 uppercase tracking-wider">
                    Verified Architectural Findings & Gotchas
                  </h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {claims.filter(c => c.is_approved).map(claim => (
                      <div key={claim.id} className="p-4 rounded-xl bg-slate-900/60 border border-slate-800 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-center mb-1.5">
                            <span className="text-[10px] font-bold text-blue-400 uppercase tracking-wide">{claim.category}</span>
                            <span className="text-[10px] text-emerald-400 font-mono">✓ Verified & Approved</span>
                          </div>
                          <h4 className="font-semibold text-sm text-slate-200">{claim.title}</h4>
                          <p className="text-xs text-slate-400 mt-1 leading-relaxed">{claim.summary}</p>
                          {claim.human_notes && (
                            <div className="mt-2.5 p-2 rounded bg-slate-950 border border-slate-800 text-xs text-slate-300">
                              💬 <b>Senior's Note:</b> {claim.human_notes}
                            </div>
                          )}
                        </div>
                        <div className="mt-3 pt-2 border-t border-slate-800/60 text-[10px] font-mono text-slate-500">
                          Anchored to: {claim.citation_source_id}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Export Action Bar */}
                <div className="p-4 rounded-xl bg-slate-900 border border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <div className="text-xs text-slate-400">
                    Handover Manifest ID: <span className="font-mono text-slate-200">RELAY-MFST-2026-FESTFLOW-01</span>
                  </div>
                  <div className="flex space-x-2">
                    <button
                      onClick={() => alert("Downloading verified handover dossier as Markdown summary...")}
                      className="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-white transition"
                    >
                      📥 Export Markdown Dossier
                    </button>
                    <button
                      onClick={() => window.print()}
                      className="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white transition"
                    >
                      🖨️ Print / Save as PDF
                    </button>
                  </div>
                </div>

              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
